# Curated keyword -> ATT&CK technique rules (deterministic, explainable).
# Rules referencing a technique absent from the loaded ATT&CK release are ignored at load time.
# confidence: how strongly the phrase implies the technique (0-100). Keyword hits are
# SUGGESTIONS for analyst review, weaker than an explicit technique id in the source.
