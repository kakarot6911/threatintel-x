[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "threatintel-x"
version = "0.1.0"
description = "THREATINTEL-X: evidence-first Cyber Threat Intelligence platform (collection, IOC lifecycle, correlation, attribution, ATT&CK, STIX 2.1, TAXII 2.1, MISP, OpenCTI)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Fazal Ahmad" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "stix2>=3.0",
  "taxii2-client>=2.3",
  "pymisp>=2.4.190",
  "jinja2>=3.1",
  "typer>=0.12",
  "dnspython>=2.6",
  "pyyaml>=6.0",
  "networkx>=3.3",
  "python-multipart>=0.0.9",
  "defusedxml>=0.7",
]

[project.optional-dependencies]
opencti = ["pycti>=6.0"]
postgres = ["psycopg[binary]>=3.1"]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "pip-audit>=2.7",
  "bandit>=1.7",
]

[project.scripts]
threatintel = "threatintel.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/threatintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["network: requires internet access (skipped by default)"]
filterwarnings = [
  "ignore::DeprecationWarning:pymisp.*",
  "ignore::DeprecationWarning:stix2.*",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101", "RUF012", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S104"]
"scripts/**" = ["S311", "E501"]  # synthetic narrative text
"tests/unit/test_extractor.py" = ["E501"]  # realistic report text sample
"tests/unit/test_collectors.py" = ["E501"]  # raw feed XML fixtures

[tool.mypy]
python_version = "3.12"
packages = ["threatintel"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true

[tool.coverage.run]
source = ["threatintel"]
